<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Bilibili Music</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
-webkit-tap-highlight-color:transparent;
}

body{
min-height:100vh;
background:#000;
color:#fff;
font-family:"Courier New",monospace;
display:flex;
justify-content:center;
padding:14px;
}

.player{
width:100%;
max-width:420px;
min-height:calc(100vh - 28px);
background:#000;
border:1px solid #222;
border-radius:28px;
padding:22px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.bilibiliLogo{width:105px;height:32px;object-fit:contain;display:block}.brand{
display:flex;
align-items:center;
gap:9px;
font-weight:bold;
letter-spacing:2px;
}

.bilibiliName{
color:#c2185b;
font-size:16px;
font-weight:700;
letter-spacing:1px;
}

.top button,
.addBtn{
border:1px solid #292929;
background:#0b0b0b;
color:#fff;
border-radius:14px;
padding:10px 13px;
font-family:inherit;
}

.cover{
width:100%;
aspect-ratio:1;
background:#111;
border-radius:26px;
overflow:hidden;
border:1px solid #292929;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 15px 45px rgba(0,0,0,.55);
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
filter:grayscale(100%);
transition:transform 1s linear;
}

.cover.playing img{
transform:scale(1.035);
}

.info{
margin-top:24px;
}

.title{
font-size:23px;
font-weight:bold;
letter-spacing:.5px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.artist{
margin-top:8px;
font-size:12px;
letter-spacing:1px;
color:#777;
}

.progress{
margin-top:27px;
}

.bar{
height:8px;
background:
radial-gradient(circle,#555 1.5px,transparent 1.6px)
0 0/8px 8px;
cursor:pointer;
}

.fill{
width:0%;
height:8px;
background:
radial-gradient(circle,#fff 1.5px,transparent 1.6px)
0 0/8px 8px;
}

.times{
display:flex;
justify-content:space-between;
color:#555;
font-size:10px;
margin-top:7px;
}

.controls{
display:flex;
justify-content:center;
align-items:center;
gap:16px;
margin-top:32px;
}

.ctrl{
width:46px;
height:46px;
border:0;
background:none;
color:#fff;
font-size:18px;
}

.ctrl.active{
color:#c2185b;
}

.play{
width:74px;
height:74px;
border-radius:50%;
border:0;
background:#fff;
color:#000;
font-size:23px;
font-weight:bold;
box-shadow:0 8px 25px rgba(255,255,255,.12);
}

.volume{
display:flex;
align-items:center;
gap:10px;
margin-top:25px;
}

.volume span{
color:#666;
font-size:10px;
}

input[type=range]{
flex:1;
appearance:none;
height:3px;
background:#333;
}

input[type=range]::-webkit-slider-thumb{
appearance:none;
width:12px;
height:12px;
border-radius:50%;
background:#fff;
}

.searchBox{
width:100%;
height:44px;
margin-top:18px;
display:flex;
align-items:center;
gap:10px;
padding:0 13px;
border:1px solid #292929;
border-radius:14px;
background:#080808;
}

.searchBox span{
color:#666;
font-size:20px;
}

.searchBox input{
width:100%;
border:0;
outline:0;
background:none;
color:#fff;
font-family:inherit;
font-size:11px;
}

.searchBox input::placeholder{
color:#444;
}

.addBtn{
width:100%;
margin-top:22px;
height:46px;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
border-color:#333;
font-size:12px;
}

input[type=file]{
display:none;
}

.playlist{
margin-top:24px;
border-top:1px dotted #292929;
padding-top:15px;
}

.playlistHead{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}

.playlistHead span{
color:#666;
font-size:10px;
}

.song{
display:flex;
align-items:center;
gap:10px;
padding:12px 4px;
border-bottom:1px dotted #222;
cursor:pointer;
}

.song.playing{
border-left:3px solid #c2185b;
background:rgba(194,24,91,.06);
padding-left:9px;
}

.num{
color:#555;
font-size:10px;
width:20px;
}

.songInfo{
flex:1;
min-width:0;
}

.songName{
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.songSize{
color:#555;
font-size:9px;
margin-top:3px;
}

.delete{
color:#555;
background:none;
border:0;
font-size:16px;
padding:5px;
}

.empty{
text-align:center;
color:#444;
padding:20px 5px;
font-size:11px;
}

.footerName{
width:100%;
margin-top:38px;
padding-top:25px;
border-top:1px dotted #292929;
text-align:center;
font-size:13px;
color:#777;
letter-spacing:1px;
}

.footerVersion{
text-align:center;
margin-top:12px;
font-size:8px;
color:#555;
}

.footerVersion span{
display:inline-block;
width:6px;
height:6px;
margin-right:6px;
background:#c2185b;
border-radius:50%;
}

.dynamicIsland{
position:fixed;
top:12px;
left:50%;
transform:translateX(-50%);
width:132px;
min-height:34px;
padding:8px 12px;
border:1px solid rgba(255,255,255,.10);
border-radius:22px;
background:#050505;
box-shadow:0 10px 35px rgba(0,0,0,.45);
z-index:9999;
overflow:hidden;
transition:
width .28s ease,
min-height .28s ease,
border-radius .28s ease;
}

.dynamicIsland.expanded{
width:min(350px,calc(100vw - 28px));
min-height:58px;
border-radius:20px;
}

.islandCompact{
display:flex;
align-items:center;
justify-content:center;
gap:7px;
}

.islandDot{
width:7px;
height:7px;
border-radius:50%;
background:#c2185b;
}

.islandText{
font-size:9px;
letter-spacing:1px;
color:#aaa;
}

.islandExpanded{
display:none;
align-items:center;
gap:10px;
}

.dynamicIsland.expanded .islandCompact{
display:none;
}

.dynamicIsland.expanded .islandExpanded{
display:flex;
}

.islandCover{
width:38px;
height:38px;
border-radius:11px;
overflow:hidden;
background:#161616;
flex:none;
}

.islandCover img{
width:100%;
height:100%;
object-fit:cover;
filter:grayscale(100%);
}

.islandInfo{
flex:1;
min-width:0;
}

.islandTitle{
font-size:10px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.islandArtist{
margin-top:3px;
font-size:8px;
color:#666;
}

.islandPlay{
width:32px;
height:32px;
border:0;
border-radius:50%;
background:#fff;
color:#000;
font-size:11px;
}

@media(max-height:720px){
.cover{
max-height:280px;
}
}
</style>
</head>

<body>

<div class="dynamicIsland" id="dynamicIsland">

<div class="islandCompact">
<span class="islandDot"></span>
<span class="islandText">BILIBILI MUSIC</span>
</div>

<div class="islandExpanded">

<div class="islandCover">
<img
id="islandCover"
src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=300">
</div>

<div class="islandInfo">

<div
class="islandTitle"
id="islandTitle">
NO SONG
</div>

<div
class="islandArtist"
id="islandArtist">
BILIBILI MUSIC
</div>

</div>

<button
class="islandPlay"
id="islandPlay">
▶
</button>

</div>

</div>

<div class="player">

<div class="top">

<div class="brand">
<span class="bilibiliName">
BILIBILI
</span>
</div>

<button onclick="clearPlaylist()">
CLEAR
</button>

</div>

<div class="cover">

<img
id="cover"
src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=900">

</div>

<div class="info">

<div
class="title"
id="title">
NO SONG
</div>

<div
class="artist"
id="artist">
ADD MUSIC TO START
</div>

</div>

<div class="progress">

<div
class="bar"
id="bar">

<div
class="fill"
id="fill">
</div>

</div>

<div class="times">

<span id="current">
0:00
</span>

<span id="duration">
0:00
</span>

</div>

</div>

<div class="controls">

<button
class="ctrl"
id="shuffle">
⤨
</button>

<button
class="ctrl"
onclick="previousSong()">
◀◀
</button>

<button
class="play"
id="play">
▶
</button>

<button
class="ctrl"
onclick="nextSong()">
▶▶
</button>

<button
class="ctrl"
id="repeat">
↻
</button>

</div>

<div class="volume">

<span>
VOL
</span>

<input
id="volume"
type="range"
min="0"
max="1"
step=".01"
value="1">

</div>

<div class="searchBox">

<span>
⌕
</span>

<input
id="searchInput"
type="text"
placeholder="SEARCH MUSIC...">

</div>

<label class="addBtn">

+ ADD MUSIC

<input
id="fileInput"
type="file"
accept="audio/*"
multiple>

</label>

<div class="playlist">

<div class="playlistHead">

<span>
PLAYLIST
</span>

<span id="count">
00 TRACKS
</span>

</div>

<div id="songs">

<div class="empty">
NO MUSIC ADDED
</div>

</div>

</div>

<div class="footerName">
© 2026 BILIBILI • S R I R A M
</div>

<div class="footerVersion">
<span></span>
v1.0
</div>

</div>

<audio id="audio"></audio>

<script>

const audio=document.getElementById("audio");
const fileInput=document.getElementById("fileInput");
const playBtn=document.getElementById("play");
const fill=document.getElementById("fill");
const bar=document.getElementById("bar");
const current=document.getElementById("current");
const duration=document.getElementById("duration");
const volume=document.getElementById("volume");
const title=document.getElementById("title");
const artist=document.getElementById("artist");
const songs=document.getElementById("songs");
const count=document.getElementById("count");
const searchInput=document.getElementById("searchInput");
const dynamicIsland=document.getElementById("dynamicIsland");
const islandTitle=document.getElementById("islandTitle");
const islandArtist=document.getElementById("islandArtist");
const islandCover=document.getElementById("islandCover");
const islandPlay=document.getElementById("islandPlay");

let playlist=[];
let currentIndex=-1;
let shuffle=false;

const DB_NAME="BilibiliMusicDB";
const DB_VERSION=1;
const STORE="songs";
let db=null;

function formatTime(s){
  if(!Number.isFinite(s)) return "0:00";
  return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
}
function escapeHTML(t){
  const d=document.createElement("div");
  d.textContent=t||"";
  return d.innerHTML;
}
function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,DB_VERSION);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE))
        d.createObjectStore(STORE,{keyPath:"id"});
    };
    r.onsuccess=()=>{db=r.result;resolve(db)};
    r.onerror=()=>reject(r.error);
  });
}
function dbPut(song){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).put(song);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
function dbAll(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const r=tx.objectStore(STORE).getAll();
    r.onsuccess=()=>resolve(r.result||[]);
    r.onerror=()=>reject(r.error);
  });
}
function dbDelete(id){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
function dbClear(){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).clear();
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
function makeId(){
  return Date.now()+"-"+Math.random().toString(36).slice(2);
}
function updateIsland(i){
  const s=playlist[i];
  if(!s)return;
  islandTitle.textContent=(s.name||"NO SONG").toUpperCase();
  islandArtist.textContent=s.artist||"LOCAL MUSIC";
}
function renderPlaylist(filter=""){
  const q=filter.trim().toLowerCase();
  count.textContent=String(playlist.length).padStart(2,"0")+" TRACKS";
  songs.innerHTML="";
  const visible=playlist.map((song,index)=>({song,index}))
    .filter(x=>!q || ((x.song.name||"")+" "+(x.song.artist||"")).toLowerCase().includes(q));

  if(!visible.length){
    songs.innerHTML='<div class="empty">'+(playlist.length?"NO MATCHING MUSIC":"NO MUSIC ADDED")+"</div>";
    return;
  }

  visible.forEach(({song,index})=>{
    const row=document.createElement("div");
    row.className="song "+(index===currentIndex?"playing":"");
    row.innerHTML=`
      <div class="num">${String(index+1).padStart(2,"0")}</div>
      <div class="songInfo">
        <div class="songName">${escapeHTML(song.name)}</div>
        <div class="songSize">${escapeHTML(song.size||"LOCAL MUSIC")}</div>
      </div>
      <button class="delete" type="button">×</button>`;
    row.onclick=e=>{
      if(e.target.closest(".delete"))return;
      loadSong(index,true);
    };
    row.querySelector(".delete").onclick=e=>{
      e.stopPropagation();
      removeSong(index);
    };
    songs.appendChild(row);
  });
}
function loadSong(i,autoPlay=false){
  if(!playlist[i])return;
  currentIndex=i;
  const s=playlist[i];
  audio.src=s.url;
  title.textContent=(s.name||"NO SONG").toUpperCase();
  artist.textContent=s.artist||"LOCAL MUSIC";
  updateIsland(i);
  fill.style.width="0%";
  current.textContent="0:00";
  duration.textContent="0:00";
  renderPlaylist(searchInput.value);
  if(autoPlay)audio.play().catch(()=>{});
}

/* AUTOMATIC ANDROID DEVICE MUSIC SCAN */
window.onNativeMusicScan=function(items){
  if(!Array.isArray(items))return;

  const existing=new Set(playlist.map(s=>String(s.id)));

  items.forEach(s=>{
    if(existing.has(String(s.id)))return;
    existing.add(String(s.id));

    playlist.push({
      id:s.id,
      name:s.name||"UNKNOWN SONG",
      artist:s.artist||"LOCAL MUSIC",
      size:s.size||"DEVICE MUSIC",
      type:s.type||"audio/mpeg",
      url:s.url,
      native:true
    });
  });

  renderPlaylist(searchInput.value);

  if(currentIndex===-1 && playlist.length)
    loadSong(0,false);
};

function startAutomaticDeviceScan(){
  try{
    if(window.MusicBridge){
      MusicBridge.requestMusicAccess();
    }
  }catch(e){
    console.error("Automatic music scan failed",e);
  }
}

/* SAVE SELECTED AUDIO PERMANENTLY */
fileInput.onchange=async function(){
  const files=Array.from(this.files||[]);
  for(const file of files){
    if(!file.type.startsWith("audio/"))continue;

    const id=makeId();
    const data=await file.arrayBuffer();
    const saved={
      id,
      name:file.name.replace(/\.[^/.]+$/,""),
      artist:"LOCAL MUSIC",
      size:(file.size/1024/1024).toFixed(1)+" MB",
      type:file.type||"audio/mpeg",
      data
    };

    try{
      await dbPut(saved);
      const blob=new Blob([data],{type:saved.type});
      playlist.push({
        id:saved.id,
        name:saved.name,
        artist:saved.artist,
        size:saved.size,
        url:URL.createObjectURL(blob)
      });
    }catch(e){
      console.error("Save failed",e);
    }
  }

  renderPlaylist();
  if(currentIndex===-1 && playlist.length)
    loadSong(0,true);

  this.value="";
};

async function removeSong(i){
  const s=playlist[i];
  if(!s)return;

  if(!s.native){
    try{await dbDelete(s.id)}catch(e){console.error(e)}
  }
  try{URL.revokeObjectURL(s.url)}catch(e){}

  const was=i===currentIndex;
  playlist.splice(i,1);

  if(!playlist.length){
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    currentIndex=-1;
    title.textContent="NO SONG";
    artist.textContent="ADD MUSIC TO START";
    current.textContent="0:00";
    duration.textContent="0:00";
    fill.style.width="0%";
  }else if(was){
    currentIndex=-1;
    loadSong(Math.min(i,playlist.length-1),false);
  }else if(i<currentIndex){
    currentIndex--;
  }
  renderPlaylist(searchInput.value);
}

async function clearPlaylist(){
  try{await dbClear()}catch(e){console.error(e)}
  playlist.forEach(s=>{try{URL.revokeObjectURL(s.url)}catch(e){}});
  playlist=[];
  currentIndex=-1;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  title.textContent="NO SONG";
  artist.textContent="ADD MUSIC TO START";
  current.textContent="0:00";
  duration.textContent="0:00";
  fill.style.width="0%";
  renderPlaylist();
}

playBtn.onclick=()=>{
  if(!audio.src)return;
  audio.paused?audio.play().catch(()=>{}):audio.pause();
};
islandPlay.onclick=e=>{
  e.stopPropagation();
  if(!audio.src)return;
  audio.paused?audio.play().catch(()=>{}):audio.pause();
};
dynamicIsland.onclick=e=>{
  if(e.target!==islandPlay)dynamicIsland.classList.toggle("expanded");
};

audio.onplay=()=>{
  playBtn.textContent="Ⅱ";
  islandPlay.textContent="Ⅱ";
  document.querySelector(".cover").classList.add("playing");
  dynamicIsland.classList.add("expanded");
};
audio.onpause=()=>{
  playBtn.textContent="▶";
  islandPlay.textContent="▶";
  document.querySelector(".cover").classList.remove("playing");
};
audio.onloadedmetadata=()=>{
  duration.textContent=formatTime(audio.duration);
};
audio.ontimeupdate=()=>{
  if(!audio.duration)return;
  fill.style.width=(audio.currentTime/audio.duration*100)+"%";
  current.textContent=formatTime(audio.currentTime);
};
audio.onended=()=>{
  if(audio.loop){
    audio.currentTime=0;
    audio.play().catch(()=>{});
  }else nextSong();
};
bar.onclick=e=>{
  if(!audio.duration)return;
  const r=bar.getBoundingClientRect();
  audio.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*audio.duration;
};
volume.oninput=()=>audio.volume=Number(volume.value);
searchInput.oninput=()=>renderPlaylist(searchInput.value);

document.getElementById("shuffle").onclick=function(){
  shuffle=!shuffle;
  this.classList.toggle("active",shuffle);
};
document.getElementById("repeat").onclick=function(){
  audio.loop=!audio.loop;
  this.classList.toggle("active",audio.loop);
};

function nextSong(){
  if(!playlist.length)return;
  let n;
  if(shuffle){
    do n=Math.floor(Math.random()*playlist.length);
    while(playlist.length>1&&n===currentIndex);
  }else{
    n=currentIndex+1;
    if(n>=playlist.length)n=0;
  }
  loadSong(n,true);
}
function previousSong(){
  if(!playlist.length)return;
  if(audio.currentTime>3){audio.currentTime=0;return;}
  let n=currentIndex-1;
  if(n<0)n=playlist.length-1;
  loadSong(n,true);
}

/* RESTORE SAVED SONGS */
async function restoreSongs(){
  try{
    await openDB();
    const saved=await dbAll();

    for(const s of saved){
      const blob=new Blob([s.data],{type:s.type||"audio/mpeg"});
      playlist.push({
        id:s.id,
        name:s.name,
        artist:s.artist||"LOCAL MUSIC",
        size:s.size,
        url:URL.createObjectURL(blob)
      });
    }

    renderPlaylist();
    if(playlist.length)loadSong(0,false);
  }catch(e){
    console.error("Database error",e);
  }
}

restoreSongs();
setTimeout(startAutomaticDeviceScan,350);

</script>

</body>
</html>
