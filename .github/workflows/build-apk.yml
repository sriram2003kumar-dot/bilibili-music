name: Build Bilibili APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          rm -rf android-project
          mkdir -p android-project

          unzip -q "$ZIP" -d android-project

          PROJECT_DIR=$(find android-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find android-project -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Apply Bilibili feature fixes
        shell: bash
        run: |
          set -e

          APP_ASSETS="$PROJECT_DIR/app/src/main/assets"

          mkdir -p "$APP_ASSETS"

          if [ -f "feature-fix.js" ]; then
            cp -f "feature-fix.js" "$APP_ASSETS/feature-fix.js"
            echo "feature-fix.js copied"
          else
            echo "feature-fix.js not found"
            exit 1
          fi

          INDEX="$APP_ASSETS/index.html"

          if [ ! -f "$INDEX" ]; then
            INDEX=$(find "$PROJECT_DIR/app/src/main" \
              -type f \
              -name "index.html" \
              -print -quit)
          fi

          if [ -z "$INDEX" ] || [ ! -f "$INDEX" ]; then
            echo "index.html not found"
            find "$PROJECT_DIR/app/src/main" -maxdepth 6 -type f
            exit 1
          fi

          echo "Using index: $INDEX"

          python3 - "$INDEX" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          tag = '<script src="feature-fix.js"></script>'

          if tag not in s:
              if "</body>" in s:
                  s = s.replace(
                      "</body>",
                      tag + "\n</body>",
                      1
                  )
              else:
                  s += "\n" + tag + "\n"

              p.write_text(s, encoding="utf-8")

          print("Bilibili feature script attached")
          PY

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "PROJECT_DIR=$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Android project verified"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -Pkotlin.jvm.target.validation.mode=warning

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not found"
            find "$PROJECT_DIR/app/build" -type f | head -100
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Music-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
