name: Build Bilibili APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then echo "ZIP file not found"; exit 1; fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q "$ZIP" -d android-project
          PROJECT_DIR=$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then echo "Android project not found"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Apply Bilibili feature patch
        run: |
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          cp android-patch/features.js "$PROJECT_DIR/app/src/main/assets/features.js"
          python3 android-patch/patch.py
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['PROJECT_DIR'])/'app/src/main/assets/index.html'
          s=p.read_text()
          if 'features.js' not in s:
              s=s.replace('</body>','<script src="features.js"></script>\n</body>')
              p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bilibili-Music-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
